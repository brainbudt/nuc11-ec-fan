<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Line chart: fan speed rises from about 2,960 RPM at 40–45 % minimum duty to about 4,380 RPM at 80 %; 50 % (BIOS default) gives about 3,120 RPM.">
